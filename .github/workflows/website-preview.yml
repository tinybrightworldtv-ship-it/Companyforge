name: CompanyForge Website Preview

on:
  pull_request:
    paths:
      - "apps/**"
      - "core/website/**"
      - "supabase/**"

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Build website workspace when configured
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" && vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
