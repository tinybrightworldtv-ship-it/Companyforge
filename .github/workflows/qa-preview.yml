name: CompanyForge Preview QA

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Vercel preview URL to verify"
        required: true
        type: string

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify preview
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: node scripts/qa-preview.mjs
